spring.application.name=multi-data-source


server.port=9191

# Database Configuration

#Oracle
spring.datasource.employee.jdbc-url=jdbc:oracle:thin:@//localhost:1521/globaldb
spring.datasource.employee.username=lova
spring.datasource.employee.password=lova
spring.datasource.employee.driver-class-name=oracle.jdbc.OracleDriver


spring.datasource.employee.hikari.pool-name=employee-db-connection-pool
spring.datasource.employee.hikari.minimum-idle=3
spring.datasource.employee.hikari.maximum-pool-size=5
spring.datasource.employee.hikari.idle-timeout=600000
spring.datasource.employee.hikari.max-lifetime=1800000
spring.datasource.employee.hikari.connection-timeout=30000
spring.datasource.employee.hikari.validation-timeout=5000


#Mysql
spring.datasource.users.jdbc-url=jdbc:mysql://localhost:3306/mydb
spring.datasource.users.username=root
spring.datasource.users.password=Root
spring.datasource.users.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.users.hikari.pool-name=user-db-connection-pool
spring.datasource.users.hikari.minimum-idle=3
spring.datasource.users.hikari.maximum-pool-size=5
spring.datasource.users.hikari.idle-timeout=600000
spring.datasource.users.hikari.max-lifetime=1800000
spring.datasource.users.hikari.connection-timeout=30000
spring.datasource.users.hikari.validation-timeout=5000


# JPA / Hibernate Configuration
spring.jpa.show-sql = true
spring.jpa.properties.hibernate.format_sql = true
spring.jpa.hibernate.ddl-auto = update


#Logger Configuration
logging.level.root=INFO